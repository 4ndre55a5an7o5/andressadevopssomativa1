name: CD

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:

jobs:
  docker-delivery:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devops-study-api:${{ github.sha }} .

      - name: Run container
        run: docker run -d -p 5000:5000 --name devops-study-api devops-study-api:${{ github.sha }}

      - name: Wait for application startup
        run: sleep 5

      - name: Smoke test application
        run: curl --fail http://localhost:5000/health

      - name: Export Docker image on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save devops-study-api:${{ github.sha }} -o devops-study-api.tar

      - name: Upload Docker artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: devops-study-api-image
          path: devops-study-api.tar
