name: Alerts

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed

jobs:
  notify-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Send alert to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_ACTION: ${{ github.event.action }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "Secret DISCORD_WEBHOOK_URL is not configured."
            exit 1
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            MESSAGE="🔔 PR #$PR_NUMBER ($PR_ACTION) em $REPOSITORY por @$ACTOR. Branch: $REF_NAME. Run: $RUN_URL"
          else
            SHORT_SHA=$(echo "$SHA" | cut -c1-7)
            MESSAGE="✅ Push em $REPOSITORY por @$ACTOR na branch $REF_NAME (commit $SHORT_SHA). Run: $RUN_URL"
          fi

          PAYLOAD=$(printf '{"content":"%s"}' "$MESSAGE")
          curl -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"
